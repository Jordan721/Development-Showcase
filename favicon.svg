<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>

  <!-- Constellation lines -->
  <g stroke="#a855f7" stroke-width="1" opacity="0.3">
    <line x1="8" y1="12" x2="20" y2="8"/>
    <line x1="20" y1="8" x2="44" y2="10"/>
    <line x1="44" y1="10" x2="56" y2="16"/>
    <line x1="8" y1="12" x2="10" y2="28"/>
    <line x1="56" y1="16" x2="54" y2="36"/>
    <line x1="10" y1="28" x2="12" y2="52"/>
    <line x1="54" y1="36" x2="52" y2="54"/>
    <line x1="12" y1="52" x2="32" y2="58"/>
    <line x1="52" y1="54" x2="32" y2="58"/>
  </g>

  <!-- Constellation nodes -->
  <circle cx="8" cy="12" r="2" fill="url(#accent)"/>
  <circle cx="20" cy="8" r="2.5" fill="url(#accent)"/>
  <circle cx="44" cy="10" r="2" fill="url(#accent)"/>
  <circle cx="56" cy="16" r="2.5" fill="url(#accent)"/>
  <circle cx="10" cy="28" r="1.5" fill="url(#accent)"/>
  <circle cx="54" cy="36" r="1.5" fill="url(#accent)"/>
  <circle cx="12" cy="52" r="2" fill="url(#accent)"/>
  <circle cx="52" cy="54" r="2" fill="url(#accent)"/>
  <circle cx="32" cy="58" r="2.5" fill="url(#accent)"/>

  <!-- Small accent stars -->
  <circle cx="50" cy="8" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="6" cy="42" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="58" cy="48" r="1" fill="#fff" opacity="0.4"/>

  <!-- JA text -->
  <text x="32" y="38" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="24" fill="url(#accent)" letter-spacing="-1">JA</text>
</svg>
