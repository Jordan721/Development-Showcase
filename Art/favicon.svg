<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Gold ornate frame (outer) -->
  <rect x="2" y="6" width="60" height="52" rx="2" fill="#c9a96e"/>
  <rect x="3" y="7" width="58" height="50" rx="1.5" fill="#b8923e"/>
  <!-- Frame inner bevel -->
  <rect x="5" y="9" width="54" height="46" rx="1" fill="#d4aa5c"/>
  <rect x="7" y="11" width="50" height="42" rx="1" fill="#c9a96e"/>
  <!-- Canvas (white/cream) -->
  <rect x="9" y="13" width="46" height="38" rx="0.5" fill="#faf5eb"/>
  <!-- Painting: sunset landscape -->
  <!-- Sky gradient -->
  <rect x="9" y="13" width="46" height="18" fill="#e8a87c" opacity="0.6"/>
  <rect x="9" y="13" width="46" height="10" fill="#f4c28f" opacity="0.5"/>
  <rect x="9" y="13" width="46" height="5" fill="#fce4b8" opacity="0.4"/>
  <!-- Sun -->
  <circle cx="38" cy="22" r="5" fill="#f0c75e" opacity="0.9"/>
  <circle cx="38" cy="22" r="3.5" fill="#fad978" opacity="0.8"/>
  <!-- Mountains -->
  <polygon points="9,31 20,20 31,31" fill="#7a6b8a" opacity="0.7"/>
  <polygon points="22,31 35,18 48,31" fill="#8e7fa0" opacity="0.6"/>
  <polygon points="38,31 50,22 55,31" fill="#6d5f7e" opacity="0.65"/>
  <!-- Green hills -->
  <ellipse cx="32" cy="35" rx="28" ry="8" fill="#6a9e6b" opacity="0.7"/>
  <ellipse cx="20" cy="38" rx="18" ry="6" fill="#5a8a5c" opacity="0.6"/>
  <!-- Water/lake reflection -->
  <ellipse cx="32" cy="43" rx="20" ry="5" fill="#7aadcf" opacity="0.5"/>
  <!-- Foreground grass -->
  <rect x="9" y="44" width="46" height="7" fill="#4a7a4c" opacity="0.5" rx="0.5"/>
  <!-- Frame corner accents -->
  <circle cx="6" cy="10" r="1.5" fill="#d4aa5c" opacity="0.8"/>
  <circle cx="58" cy="10" r="1.5" fill="#d4aa5c" opacity="0.8"/>
  <circle cx="6" cy="54" r="1.5" fill="#d4aa5c" opacity="0.8"/>
  <circle cx="58" cy="54" r="1.5" fill="#d4aa5c" opacity="0.8"/>
</svg>