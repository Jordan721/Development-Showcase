<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typebound Dungeon | Game</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body class="game-page">

    <!-- Game Container -->
    <div class="game-container" id="gameContainer">

        <!-- Top HUD -->
        <header class="game-hud">
            <a href="index.html" class="hud-back"><i class="fas fa-arrow-left"></i></a>
            <div class="hud-title">TYPEBOUND DUNGEON</div>
            <div class="hud-floor">FLOOR <span id="floorNum">1</span></div>
        </header>

        <!-- Main Game Area -->
        <div class="game-layout">

            <!-- Stats Sidebar -->
            <aside class="stats-sidebar">
                <div class="stat-group">
                    <div class="stat-label">HP</div>
                    <div class="hp-bar">
                        <div class="hp-fill" id="hpFill"></div>
                        <span class="hp-text" id="hpText">100 / 100</span>
                    </div>
                </div>
                <div class="stat-group">
                    <div class="stat-label">FLOOR</div>
                    <div class="stat-val" id="statFloor">1</div>
                </div>
                <div class="stat-group">
                    <div class="stat-label">ENEMIES</div>
                    <div class="stat-val" id="statKills">0</div>
                </div>
                <div class="stat-group">
                    <div class="stat-label">WPM</div>
                    <div class="stat-val" id="statWpm">0</div>
                </div>
                <div class="stat-group">
                    <div class="stat-label">ACCURACY</div>
                    <div class="stat-val" id="statAccuracy">100%</div>
                </div>
                <div class="stat-group">
                    <div class="stat-label">SCORE</div>
                    <div class="stat-val highlight" id="statScore">0</div>
                </div>

                <div class="minimap-container">
                    <div class="stat-label">MAP</div>
                    <div class="minimap" id="minimap"></div>
                </div>
            </aside>

            <!-- Dungeon Grid -->
            <div class="dungeon-wrapper">
                <div class="dungeon-grid" id="dungeonGrid">
                    <!-- 9x9 tiles generated by JS -->
                </div>
                <div class="dungeon-msg" id="dungeonMsg"></div>
            </div>

            <!-- Card Hand -->
            <aside class="card-hand" id="cardHand">
                <div class="hand-label">CARDS</div>
                <div class="hand-slots" id="handSlots">
                    <div class="card-slot empty"><i class="fas fa-plus"></i></div>
                    <div class="card-slot empty"><i class="fas fa-plus"></i></div>
                    <div class="card-slot empty"><i class="fas fa-plus"></i></div>
                    <div class="card-slot empty"><i class="fas fa-plus"></i></div>
                    <div class="card-slot empty"><i class="fas fa-plus"></i></div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Combat Overlay -->
    <div class="combat-overlay" id="combatOverlay">
        <div class="combat-box">
            <div class="combat-header">
                <div class="enemy-info">
                    <span class="enemy-icon" id="enemyIcon"><i class="fas fa-skull"></i></span>
                    <span class="enemy-name" id="enemyName">Skeleton</span>
                </div>
                <div class="enemy-hp-bar">
                    <div class="enemy-hp-fill" id="enemyHpFill"></div>
                </div>
            </div>

            <div class="combat-timer">
                <div class="timer-fill" id="timerFill"></div>
            </div>

            <div class="combat-word-area">
                <div class="word-display" id="wordDisplay"></div>
                <div class="typed-display" id="typedDisplay"></div>
            </div>

            <div class="combat-input-area">
                <input type="text" id="combatInput" class="combat-input" autocomplete="off" spellcheck="false"
                    autofocus>
            </div>

            <div class="combat-cards" id="combatCards">
                <!-- Active cards shown here during combat -->
            </div>

            <div class="combat-feedback" id="combatFeedback"></div>
        </div>
    </div>

    <!-- Chest Overlay -->
    <div class="chest-overlay" id="chestOverlay">
        <div class="chest-box">
            <div class="chest-icon"><i class="fas fa-treasure-chest"></i></div>
            <h2>CHEST OPENED!</h2>
            <div class="chest-card" id="chestCard">
                <div class="card-inner">
                    <div class="card-front">
                        <div class="card-art" id="chestCardArt"><i class="fas fa-question"></i></div>
                    </div>
                    <div class="card-back">
                        <div class="card-name" id="chestCardName"></div>
                        <div class="card-desc" id="chestCardDesc"></div>
                    </div>
                </div>
            </div>
            <button class="chest-btn" id="chestCollect">COLLECT</button>
            <button class="chest-btn secondary" id="chestDiscard">DISCARD</button>
        </div>
    </div>

    <!-- Floor Transition -->
    <div class="floor-transition" id="floorTransition">
        <div class="floor-text">
            <span class="floor-label">FLOOR</span>
            <span class="floor-number" id="transFloor">2</span>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div class="gameover-overlay" id="gameoverOverlay">
        <div class="gameover-box">
            <h1 class="gameover-title">GAME OVER</h1>
            <div class="gameover-stats">
                <div class="go-stat">
                    <span class="go-label">FLOOR REACHED</span>
                    <span class="go-val" id="goFloor">1</span>
                </div>
                <div class="go-stat">
                    <span class="go-label">ENEMIES SLAIN</span>
                    <span class="go-val" id="goKills">0</span>
                </div>
                <div class="go-stat">
                    <span class="go-label">BEST WPM</span>
                    <span class="go-val" id="goWpm">0</span>
                </div>
                <div class="go-stat">
                    <span class="go-label">ACCURACY</span>
                    <span class="go-val" id="goAccuracy">0%</span>
                </div>
                <div class="go-stat big">
                    <span class="go-label">FINAL SCORE</span>
                    <span class="go-val" id="goScore">0</span>
                </div>
            </div>
            <div class="gameover-actions">
                <button class="go-btn primary" id="goRetry"><i class="fas fa-redo"></i> TRY AGAIN</button>
                <a href="index.html" class="go-btn"><i class="fas fa-home"></i> MENU</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
